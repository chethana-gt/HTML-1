<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <form>
        <fieldset>
            <label for="User">Username: </label>
            <input type="text" id="User" name="username" value="Chethana" placeholder="Enter Username" required>
            <br><br>

            <label for="Pass">Password: </label>
            <input type="password" id="Pass" name="Password" placeholder="Enter Password" required>
            <br><br>

            <label for="email">Email: </label>
            <input type="email" id="email" name="email" placeholder="Enter email address" required>
            <br><br>

            <label for="ph number">Phone Number: </label>
            <input type="tel" minlength="10" maxlength="10" placeholder="Enter ph number" id="phnum">
            <br><br>

            <label for="dob">Date of Birth: </label>
            <input type="datetime-local">
            <br><br>

            <label for="age">Age: </label>
            <input type="number" placeholder="Enter age" min="18" max="25">
            <br><br>

            <label for="address">Enter address: </label>
            <textarea rows="5" cols="10"></textarea>
            <br><br>

            <label for="gender">Gender: </label>
            <input type="radio" name="gender" value="male">Male
            <input type="radio" name="gender" value="female">Female
            <input type="radio" name="gender" value="others">Others
            <br><br>

            <label for="skills">Skills: </label>
            <input type="checkbox" value="Java">Java
            <input type="checkbox" value="Python">Python
            <input type="checkbox" value="DSA">DSA
            <br><br>

            <label for="states">Select States</label>
            <select name="" id="">
                <option value="Karnataka">Karnataka</option>
                <option value="Kerala">Kerala</option>
                <option value="Tamil Nadu">Tamil Nadu</option>
                <option value="Hyderabad">Hyderabad</option>
            </select>
            <br><br>

            <input type="range">
            <input type="color" name="" id="">
            <input type="search">
            <input type="url">
            <br><br>

            <label for="">Upload Iamges</label>
            <input type="file">
            <br><br>

            <button>Submit</button>
            <button>cancel</button>
        </fieldset>
    </form>
</body>
</html>
